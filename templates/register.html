<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register - AI Resume Screening & Ranking</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Same font as index & login -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #f4f7fb 50%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #1e3c72;
        }

        .register-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(30, 60, 114, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-width: 430px;
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        .register-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #ffdd57, #1e3c72);
        }

        .register-container h2 {
            font-size: 2rem;
            font-weight: 600;
            text-align: center;
            margin-bottom: 10px;
            color: #1e3c72;
        }

        .register-container .subtitle {
            text-align: center;
            color: #425b8a;
            margin-bottom: 35px;
            font-size: 0.95rem;
        }

        .flash-message {
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 25px;
            font-size: 0.9rem;
            font-weight: 500;
            text-align: center;
            background: linear-gradient(135deg, #ffdd57, #ffcb3f);
            color: #1e3c72;
            border: 1px solid rgba(255, 221, 87, 0.3);
            box-shadow: 0 4px 12px rgba(255, 221, 87, 0.2);
        }

        .form-group {
            margin-bottom: 22px;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #1e3c72;
            font-size: 0.95rem;
        }

        .form-group input {
            width: 100%;
            padding: 15px 18px;
            border: 2px solid #e1e8f0;
            border-radius: 12px;
            font-size: 1rem;
            font-family: 'Poppins', sans-serif;
            background: rgba(255, 255, 255, 0.9);
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }

        .form-group input:focus {
            outline: none;
            border-color: #ffdd57;
            box-shadow: 0 0 0 4px rgba(255, 221, 87, 0.1);
            background: #fff;
            transform: translateY(-1px);
        }

        .btn-register {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #ffdd57, #ffcb3f);
            color: #1e3c72;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 8px 20px rgba(255, 221, 87, 0.3);
        }

        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(255, 221, 87, 0.4);
        }

        .btn-register:active {
            transform: translateY(0);
        }

        .links {
            text-align: center;
            margin-top: 25px;
        }

        .links p {
            color: #425b8a;
            font-size: 0.9rem;
            margin-bottom: 8px;
        }

        .links a {
            color: #ffdd57;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .links a:hover {
            color: #1e3c72;
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .register-container {
                padding: 40px 30px;
                margin: 10px;
            }

            .register-container h2 {
                font-size: 1.7rem;
            }
        }
    </style>
</head>
<body>
    <div class="register-container">
        <h2>Create Account</h2>
        <p class="subtitle">Join the AI Resume Screening platform in a few steps</p>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="flash-message">{{ messages[0] }}</div>
            {% endif %}
        {% endwith %}

        <form method="POST" class="form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>

            <button type="submit" class="btn-register">Sign Up</button>
        </form>

        <div class="links">
            <p>Already have an account? <a href="{{ url_for('login') }}">Login</a></p><br>
            <p><a href="{{ url_for('index') }}">Back to Home</a></p>
        </div>
    </div>
    <script>
    // Auto-hide flash message
    setTimeout(() => {
        const flash = document.querySelector('.flash-message');
        if (flash) {
            flash.style.opacity = '0';
            flash.style.transition = 'opacity 0.5s ease';
            setTimeout(() => flash.remove(), 500);
        }
    }, 3500);
</script>
</body>
</html>
