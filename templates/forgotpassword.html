<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | AI Resume Screening</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #f4f7fb 50%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #1e3c72;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 44px 38px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(30, 60, 114, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-width: 420px;
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #ffdd57, #1e3c72);
        }

        h2 {
            font-size: 2rem;
            font-weight: 600;
            text-align: center;
            margin-bottom: 8px;
            color: #1e3c72;
        }

        .subtitle {
            text-align: center;
            color: #425b8a;
            margin-bottom: 28px;
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #1e3c72;
            font-size: 0.95rem;
        }

        input[type="email"] {
            width: 100%;
            padding: 14px 16px;
            border-radius: 12px;
            border: 2px solid #e1e8f0;
            font-size: 0.95rem;
            font-family: 'Poppins', sans-serif;
            background: rgba(255, 255, 255, 0.9);
            transition: all 0.3s ease;
        }

        input[type="email"]:focus {
            outline: none;
            border-color: #ffdd57;
            box-shadow: 0 0 0 4px rgba(255, 221, 87, 0.1);
            background: #ffffff;
        }

        button[type="submit"] {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            background: #ffdd57;
            color: #1e3c72;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(255, 221, 87, 0.35);
        }

        button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 26px rgba(255, 221, 87, 0.4);
        }

        #resetMessage {
            display: none;
            margin-top: 14px;
            font-size: 0.9rem;
            text-align: center;
        }

        .links {
            margin-top: 20px;
            text-align: center;
            font-size: 0.85rem;
            color: #425b8a;
        }

        .links a {
            color: #ffdd57;
            text-decoration: none;
            font-weight: 500;
        }

        .links a:hover {
            color: #1e3c72;
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .container {
                padding: 36px 26px;
            }

            h2 {
                font-size: 1.7rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Forgot Password</h2>
        <p class="subtitle">Enter your account email and a password reset link will be sent if the account exists.</p>

        <form id="forgotPasswordForm" class="form">
            <div class="form-group">
                <label for="forgotEmail">Email</label>
                <input type="email" id="forgotEmail" name="email" placeholder="you@example.com" required>
            </div>
            <button type="submit">Send Reset Link</button>
        </form>

        <p id="resetMessage"></p>

        <div class="links">
            <p><a href="{{ url_for('login') }}">Back to Login</a></p>
        </div>
    </div>

    <script>
        const form = document.getElementById("forgotPasswordForm");
        const emailInput = document.getElementById("forgotEmail");
        const resetMessage = document.getElementById("resetMessage");

        form.addEventListener("submit", function (event) {
            event.preventDefault();

            const email = emailInput.value.trim();
            if (!email) return;

            fetch("{{ url_for('forgotpassword') }}", {
                method: "POST",
                headers: {
                    "Content-Type": "application/x-www-form-urlencoded"
                },
                body: new URLSearchParams({ email })
            })
            .then(response => response.json())
            .then(data => {
                resetMessage.textContent = data.message || "If this email is registered, a reset link has been sent.";
                resetMessage.style.display = "block";
                resetMessage.style.color = data.status === "error" ? "crimson" : "green";

                // Optional: fade out after a few seconds
                setTimeout(() => {
                    resetMessage.style.opacity = "0";
                    resetMessage.style.transition = "opacity 0.5s ease";
                }, 3500);
            })
            .catch(error => {
                console.error("Error:", error);
                resetMessage.textContent = "Something went wrong. Please try again.";
                resetMessage.style.display = "block";
                resetMessage.style.color = "crimson";
            });
        });
    </script>
</body>
</html>
